name = "newstrix"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Hyperdrive binding — connects Cloudflare Workers to your Digital Ocean PostgreSQL.
# Steps to set up:
#   1. Go to Cloudflare dashboard → Workers & Pages → Hyperdrive
#   2. Create a new Hyperdrive config pointing to your DO PostgreSQL host/port/db/user/password
#   3. Copy the generated Hyperdrive ID and replace "YOUR_HYPERDRIVE_ID" below
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "106835a97f094af79adb3979522d6d2a"
